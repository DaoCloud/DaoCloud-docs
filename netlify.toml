# Netlify builds Deploy Previews for pull requests only.
# Production (pushes to main), branch deploys and any other context are
# skipped to save build minutes. Docs:
# https://docs.netlify.com/build/configure-builds/ignore-builds/
[build]
  ignore = 'if [ "$CONTEXT" = "deploy-preview" ]; then exit 1; else exit 0; fi'
