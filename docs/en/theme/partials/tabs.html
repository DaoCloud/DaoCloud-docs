{% import "partials/tabs-item.html" as item with context %}
<nav class="md-tabs" aria-label="{{ lang.t('tabs') }}" data-md-component="tabs">
  <div class="md-grid">
    <ul class="md-tabs__list">
      {% for nav_item in nav.items %}
        {% if nav_item.title == "Documentation" %}
          <li class="md-tabs__item product-docs-menu{% if nav_item.active %} md-tabs__item--active{% endif %}">
            <details>
              <summary class="md-tabs__link" aria-label="Documentation">
                Documentation <span class="product-docs-menu__caret" aria-hidden="true">▾</span>
              </summary>
              <div class="product-docs-menu__list" role="menu" aria-label="Documentation">
                <a href="{{ (nav_item.children | first).url | url }}" role="menuitem">DCE 5.0 Docs</a>
                <a href="https://docs.d.run/en/" rel="noopener noreferrer" role="menuitem">d.run Docs</a>
              </div>
            </details>
          </li>
        {% else %}
          {{ item.render(nav_item) }}
        {% endif %}
      {% endfor %}
    </ul>
  </div>
</nav>
