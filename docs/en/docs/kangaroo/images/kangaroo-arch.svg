<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 630" role="img" aria-labelledby="title desc">
  <title id="title">Container Registry Logical Architecture</title>
  <desc id="desc">Four layers from top to bottom: access entries (user push/pull, CLI, Jenkins, Kubernetes, Tekton, Helm); container registry lifecycle management in two clearly separated groups, each with a role label and four capabilities on its right - Workspace: Registry Space, Integrated Registry, Image Scanning, Image Reclaim; Admin: Create Managed Harbor, Integrated Registry, Sync Images, Registry Space Binding Workspace; below them, Registry instance management. Orange dashed control flow delivers registry management and permission control from instance management to the registries in the local data center cluster01 and the remote data center cluster02. Gray solid data flow shows clusters pulling image/chart from their local registry to deploy clusters or applications. Sync Images keeps artifacts consistent between the two registries. Orange dashed lines are control flow; gray solid lines are data flow.</desc>
