  <title id="title">Cloud-Edge Collaborative Storage Scenarios</title>
  <desc id="desc">The cloud provides user and permission management, unified authentication, security, app delivery, image registry, open data and more. The edge side is organized into node autonomy, edge application management, and edge data management, connecting to industrial devices such as smart manufacturing, smart stores and smart wearables through the standard edge data collection interface.</desc>
