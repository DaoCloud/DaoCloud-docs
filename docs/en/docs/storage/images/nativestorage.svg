<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 576" role="img" aria-labelledby="title desc">
  <title id="title">Cloud Native Storage Architecture</title>
  <desc id="desc">Applications in the container cluster are grouped into data collection, data storage, data analytics and data sharing. They connect to block storage, NAS storage pools and object storage through block volumes, NAS volumes and object volumes, which in turn map to local storage, distributed storage, traditional storage, Ceph and NFS.</desc>
  <style>
