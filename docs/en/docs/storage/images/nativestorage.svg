  <rect x="354" y="316" width="292" height="116" rx="10" fill="#3f66d4"/>
  <text x="370" y="344" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#f4f7fb">NAS Storage Pool</text>
  <rect x="372" y="362" width="108" height="30" rx="5" fill="#ffffff"/>
  <text x="426" y="382" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#1a2330" text-anchor="middle">High Performance</text>
  <rect x="488" y="362" width="100" height="30" rx="5" fill="#ffffff"/>
  <text x="538" y="382" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#1a2330" text-anchor="middle">Large Capacity</text>
  <rect x="664" y="316" width="292" height="116" rx="10" fill="#3f66d4"/>
  <text x="680" y="344" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#f4f7fb">Object Storage</text>
  <rect x="676" y="362" width="108" height="30" rx="5" fill="#ffffff"/>
  <text x="730" y="382" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#1a2330" text-anchor="middle">Massive Capacity</text>
