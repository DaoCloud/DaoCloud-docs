<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">d.run AI Operating System: Modules and Scenarios at a Glance</title>
  <desc id="desc">d.run AI Operating System consists of four capability layers and 13 built-in modules. Cloud-Native AI: LLM Studio (Hydra), AI Lab, InferX Suite, ClawOS. Cloud-Native Infrastructure: Container Management (kpanda), Device Management (topohub), Container Registry (kangaroo), Cloud Native Network (mspider), Cloud Native Storage. Operations: Cockpit (crane), Copilot. O&amp;M: Insight, Global Management (ghippo). Bottom-up, it turns heterogeneous compute into metered AI productivity.</desc>

  <rect x="0.5" y="0.5" width="999" height="539" rx="14" fill="#ffffff" stroke="#e6eaf1"/>

