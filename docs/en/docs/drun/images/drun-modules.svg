<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">The d.run AI Operating System at a Glance</title>
  <desc id="desc">d.run AI Operating System consists of four capability layers and Lego-style composable modules. Cloud-Native AI: LLM Studio (Hydra), AI Lab, InferX Suite, ClawOS. Cloud-Native Infrastructure: Containers (kpanda), Devices (topohub), Registry (kangaroo), Network (network), Storage. Operations: Cockpit (crane), Copilot. O&amp;M: Insight, Global Management (ghippo). Bottom-up, it turns heterogeneous compute into metered AI productivity.</desc>
