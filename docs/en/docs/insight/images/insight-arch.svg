<svg xmlns="http://www.w3.org/2000/svg" <svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"> role="img" aria-labelledby="title desc">
  <title id="title">Insight Observability Architecture</title>
  <desc id="desc">Insight observability architecture from top to bottom: observed targets (DCE clusters, OpenShift clusters, nodes, containers and workloads, application services, K8s events); unified collection via insight-agent (metrics Prometheus, logs Fluent Bit, traces OpenTelemetry, events); the Insight observability platform (visualization and query: dashboards, infrastructure, metric query, log query, events and probes; distributed tracing: service topology, services, traces, remote sampling; alert center: alert rules, alert templates, message templates, silence and inhibition, notification config); notification channels (email, WeChat Work, DingTalk, Webhook, SMS).</desc>
  <style>
    /* Dark mode adaptation: site palette defaults to auto (follows OS). CSS rules override presentation attributes. */
    @media (prefers-color-scheme: dark) {
      rect[x="0.5"] { fill: rgba(255,255,255,0.015); stroke: #2e3540; }
      /* surfaces */
      [fill="#ffffff"]:not([x="0.5"]) { fill: #232936; }
      [fill="#f5f7fa"] { fill: #1e2530; }
      [fill="#f8fafc"] { fill: #1a212c; }
      [fill="#eef2f6"] { fill: #232b38; }
      [fill="#e8f3fd"] { fill: #1c2838; }
      [fill="#e6f7ec"] { fill: #1b2c22; }
      [fill="#fff3e0"] { fill: #2b2519; }
      /* text */
      [fill="#1a2330"] { fill: #e6ebf2; }
      [fill="#5c6775"] { fill: #b6bfcb; }
      [fill="#6b7688"] { fill: #8b95a5; }
      [fill="#1565c0"] { fill: #64b5f6; }
      [fill="#2e7d32"] { fill: #81c784; }
      [fill="#e65100"] { fill: #ffb74d; }
      [fill="#9aa8bc"] { fill: #8291a8; }
      /* strokes */
      [stroke="#e0e6ee"] { stroke: #2e3540; }
      [stroke="#e6eaf1"] { stroke: #2e3540; }
      [stroke="#cfd8e3"] { stroke: #3a4450; }
      [stroke="#90caf9"] { stroke: #2c4a6e; }
      [stroke="#81c784"] { stroke: #2c5940; }
      [stroke="#ffb74d"] { stroke: #5c4a26; }
      /* accent bars */
      [fill="#2196f3"] { fill: #42a5f5; }
      [fill="#00c853"] { fill: #4caf50; }
      [fill="#ff9800"] { fill: #ffb74d; }
    }
  </style>

  <rect x="0.5" y="0.5" width="999" height="619" rx="14" fill="#ffffff" stroke="#e6eaf1"/>

  <!-- Title -->
  <text x="500" text-anchor="middle" y="40" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#1a2330">Insight Observability Architecture</text>
  <text x="500" text-anchor="middle" y="62" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#6b7688">Unified collection of metrics · logs · traces — multi-dimensional alerting and visualization</text>

  <!-- Layer 1: Observed targets -->
  <rect x="44" y="80" width="912" height="58" rx="10" fill="#f5f7fa" stroke="#e0e6ee"/>
  <text x="68" y="106" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1a2330">Observed</text>
  <text x="68" y="126" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1a2330">Targets</text>
  <g font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="middle">
    <rect x="150" y="92" width="128" height="34" rx="7" fill="#ffffff" stroke="#cfd8e3"/>
    <text x="214" y="113" fill="#1a2330">DCE Clusters</text>
    <rect x="286" y="92" width="128" height="34" rx="7" fill="#ffffff" stroke="#cfd8e3"/>
    <text x="350" y="113" fill="#1a2330">OpenShift</text>
    <rect x="422" y="92" width="128" height="34" rx="7" fill="#ffffff" stroke="#cfd8e3"/>
    <text x="486" y="113" fill="#1a2330">Nodes</text>
    <rect x="558" y="92" width="128" height="34" rx="7" fill="#ffffff" stroke="#cfd8e3"/>
    <text x="622" y="113" fill="#1a2330" font-size="11.5">Containers &amp; Workloads</text>
    <rect x="694" y="92" width="128" height="34" rx="7" fill="#ffffff" stroke="#cfd8e3"/>
    <text x="758" y="113" fill="#1a2330">Applications</text>
    <rect x="830" y="92" width="128" height="34" rx="7" fill="#ffffff" stroke="#cfd8e3"/>
    <text x="894" y="113" fill="#1a2330">K8s Events</text>
  </g>

