    <text x="668" y="396" font-size="13" font-weight="600" fill="#2e7d32">Traces</text>
    <text x="668" y="416" font-size="11.5" fill="#5c6775">span analysis · log context</text>
    <rect x="767" y="372" width="181" height="58" rx="10" fill="#e6f7ec" stroke="#81c784"/>
    <text x="857" y="396" font-size="13" font-weight="600" fill="#2e7d32">Remote Sampling</text>
    <text x="857" y="416" font-size="11.5" fill="#5c6775">tail-based sampling</text>
  </g>

  <!-- Alert Center (orange) -->
