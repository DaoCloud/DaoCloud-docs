    <text x="424" y="490" font-size="11.5" fill="#5c6775">template-based</text>
    <rect x="504" y="446" width="144" height="58" rx="10" fill="#fff3e0" stroke="#ffb74d"/>
    <text x="576" y="470" font-size="13" font-weight="600" fill="#e65100">Message Templates</text>
    <text x="576" y="490" font-size="11.5" fill="#5c6775">customizable</text>
    <rect x="656" y="446" width="144" height="58" rx="10" fill="#fff3e0" stroke="#ffb74d"/>
    <text x="728" y="470" font-size="13" font-weight="600" fill="#e65100">Silence &amp; Inhibition</text>
    <text x="728" y="490" font-size="11.5" fill="#5c6775">time windows</text>
    <rect x="808" y="446" width="144" height="58" rx="10" fill="#fff3e0" stroke="#ffb74d"/>
    <text x="880" y="470" font-size="13" font-weight="600" fill="#e65100">Notifications</text>
    <text x="880" y="490" font-size="11.5" fill="#5c6775">multi-channel</text>
  </g>

