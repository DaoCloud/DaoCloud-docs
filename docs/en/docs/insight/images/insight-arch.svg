    <text x="576" y="322" font-size="13" font-weight="600" fill="#1565c0">Metric Query</text>
    <text x="576" y="342" font-size="11.5" fill="#5c6775">PromQL · custom</text>
    <rect x="656" y="298" width="144" height="58" rx="10" fill="#e8f3fd" stroke="#90caf9"/>
    <text x="728" y="322" font-size="13" font-weight="600" fill="#1565c0">Log Query</text>
    <text x="728" y="342" font-size="11.5" fill="#5c6775">Lucene · context</text>
    <rect x="808" y="298" width="144" height="58" rx="10" fill="#e8f3fd" stroke="#90caf9"/>
    <text x="880" y="322" font-size="13" font-weight="600" fill="#1565c0">Events &amp; Probes</text>
    <text x="880" y="342" font-size="11.5" fill="#5c6775">black-box probing</text>
  </g>

  <!-- Tracing (green) -->
  <rect x="60" y="380" width="5" height="42" rx="2" fill="#00c853"/>
