  <!-- Platform banner -->
  <rect x="44" y="242" width="912" height="32" rx="8" fill="#1976d2"/>
  <text x="500" text-anchor="middle" y="263" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff">Insight Observability Platform</text>

