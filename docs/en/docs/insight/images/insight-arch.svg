    <text x="290" y="416" font-size="11.5" fill="#5c6775">calls · traffic direction</text>
    <rect x="389" y="372" width="181" height="58" rx="10" fill="#e6f7ec" stroke="#81c784"/>
    <text x="479" y="396" font-size="13" font-weight="600" fill="#2e7d32">Services</text>
    <text x="479" y="416" font-size="11.5" fill="#5c6775">throughput · error · latency</text>
