  <text x="68" y="184" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1a2330">Unified</text>
  <text x="68" y="204" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#6b7688">insight-agent</text>
  <g font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="middle">
    <rect x="150" y="172" width="190" height="34" rx="7" fill="#ffffff" stroke="#cfd8e3"/>
    <text x="245" y="193" fill="#1a2330">Metrics Prometheus</text>
    <rect x="356" y="172" width="190" height="34" rx="7" fill="#ffffff" stroke="#cfd8e3"/>
    <text x="451" y="193" fill="#1a2330">Logs Fluent Bit</text>
