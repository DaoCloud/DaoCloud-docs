<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 690" role="img" aria-labelledby="title desc">
  <title id="title">Virtnest Product Architecture</title>
  <desc id="desc">A three-layer architecture. The top Create &amp; Access layer offers three ways to create VMs (from image, template or YAML), VNC / terminal console, SSH login and VM details; images come from container registries, HTTP file servers or S3 object storage. The middle VM Capabilities layer covers specs and images, storage and disks, networking and NICs, snapshots and cloning, migration and drift, and monitoring and health. Each VM runs in a virt-launcher Pod and is described by VirtualMachine / VirtualMachineInstance custom resources. The bottom Cloud Native Foundation layer consists of Kubernetes scheduling, KubeVirt, container networking (CNI, Multus, Spiderpool), persistent storage (PVC, VolumeSnapshotClass), and image registries with GPU / vGPU devices. Orange dashed arrows mean creation and configuration delivery, blue solid arrows mean status and data reporting, and gray solid arrows mean resource supply and image pulling.</desc>
