<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1458 787" font-family="-apple-system, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif">
  <title>Device Management Logical Architecture</title>
  <rect x="0" y="0" width="1458" height="787" fill="#FFFFFF"/>

  <!-- ========== Layer 1: Management & Control Layer ========== -->
  <rect x="1.5" y="1.5" width="1455" height="162" rx="8" fill="#F8FAFC" stroke="#595959" stroke-width="3"/>
  <text x="56" y="76" font-size="24" font-weight="bold" fill="#000000">Management &amp;</text>
  <text x="56" y="104" font-size="24" font-weight="bold" fill="#000000">Control Layer</text>
  <g stroke="#595959" stroke-width="2.5" fill="#FFFFFF">
    <rect x="309.5" y="61" width="258" height="56" rx="3"/>
    <rect x="593.5" y="61" width="257" height="56" rx="3"/>
    <rect x="876.5" y="61" width="257" height="56" rx="3"/>
    <rect x="1154.5" y="61" width="258" height="56" rx="3"/>
  </g>
  <g font-size="22" fill="#0A0A0A" text-anchor="middle">
    <text x="438" y="82">Device Discovery &amp;</text>
    <text x="438" y="108">Onboarding</text>
    <text x="722" y="96">Remote Power Control</text>
    <text x="1005" y="96">PXE Boot Provisioning</text>
    <text x="1283" y="82">Hardware Health</text>
    <text x="1283" y="108">Monitoring</text>
  </g>

  <!-- ========== Layer 2: Network & Access Layer ========== -->
  <rect x="1.5" y="187.5" width="1455" height="161" rx="8" fill="#F8FAFC" stroke="#595959" stroke-width="3"/>
  <text x="56" y="262" font-size="24" font-weight="bold" fill="#000000">Network &amp;</text>
  <text x="56" y="290" font-size="24" font-weight="bold" fill="#000000">Access Layer</text>
  <g stroke="#595959" stroke-width="2.5" fill="#FFFFFF">
    <rect x="299.5" y="247" width="367" height="56" rx="3"/>
    <rect x="689.5" y="247" width="351" height="56" rx="3"/>
    <rect x="1063.5" y="247" width="338" height="56" rx="3"/>
  </g>
  <g font-size="22" fill="#0A0A0A" text-anchor="middle">
    <text x="483" y="282">DHCP Address Assignment</text>
    <text x="865" y="268">In-band/Out-of-band</text>
    <text x="865" y="294">Subnet Management</text>
    <text x="1232" y="282">Persistent IP-MAC Binding</text>
  </g>

  <!-- ========== Layer 3: Remote Connection Methods ========== -->
  <rect x="1.5" y="376.5" width="1455" height="82" rx="8" fill="#F8FAFC" stroke="#595959" stroke-width="3"/>
  <text x="56" y="408" font-size="24" font-weight="bold" fill="#000000">Remote Connection</text>
  <text x="56" y="436" font-size="24" font-weight="bold" fill="#000000">Methods</text>
  <g stroke="#595959" stroke-width="2.5" fill="#FFFFFF">
    <rect x="301.5" y="389" width="365" height="56" rx="3"/>
    <rect x="689.5" y="389" width="351" height="56" rx="3"/>
    <rect x="1063.5" y="389" width="338" height="56" rx="3"/>
  </g>
  <g font-size="22" fill="#0A0A0A" text-anchor="middle">
    <text x="484" y="424">Redfish</text>
    <text x="865" y="424">IPMI</text>
    <text x="1232" y="424">SSH</text>
  </g>

  <!-- ========== Layer 4: Physical Device Layer ========== -->
  <rect x="1.5" y="486.5" width="1455" height="297" rx="8" fill="#F8FAFC" stroke="#595959" stroke-width="3"/>
  <text x="56" y="645" font-size="24" font-weight="bold" fill="#000000">Physical Device Layer</text>

  <!-- Group boxes -->
  <g stroke="#595959" stroke-width="2.5" fill="#FFFFFF">
    <rect x="303.5" y="518" width="505" height="225" rx="6"/>
    <rect x="841.5" y="518" width="352" height="225" rx="6"/>
    <rect x="1225.5" y="518" width="201" height="225" rx="6"/>
  </g>
  <g font-size="24" font-weight="bold" fill="#0A0A0A" text-anchor="middle">
    <text x="556" y="554">Bare Metal Servers</text>
    <text x="1017" y="554">Network Devices</text>
    <text x="1326" y="554">Storage Devices</text>
  </g>

  <!-- Icon: rack server -->
  <g stroke="#4D4D4D" stroke-width="3" fill="none">
    <rect x="356" y="595" width="48" height="62" rx="4"/>
    <line x1="356" y1="616" x2="404" y2="616"/>
    <line x1="356" y1="637" x2="404" y2="637"/>
  </g>
  <g fill="#4D4D4D">
