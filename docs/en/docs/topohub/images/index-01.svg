    <circle cx="367" cy="627" r="3"/>
    <circle cx="367" cy="648" r="3"/>
    <rect x="377" y="603" width="18" height="5" rx="2"/>
    <rect x="377" y="624" width="18" height="5" rx="2"/>
    <rect x="377" y="645" width="18" height="5" rx="2"/>
  </g>

  <!-- Icon: tower server -->
  <g stroke="#4D4D4D" stroke-width="3" fill="none">
    <rect x="526" y="592" width="46" height="66" rx="4"/>
    <line x1="526" y1="614" x2="572" y2="614"/>
    <line x1="526" y1="636" x2="572" y2="636"/>
  </g>
  <g fill="#4D4D4D">
    <circle cx="537" cy="603" r="3"/>
    <circle cx="537" cy="625" r="3"/>
    <circle cx="537" cy="647" r="3"/>
    <rect x="547" y="600" width="16" height="5" rx="2"/>
    <rect x="547" y="622" width="16" height="5" rx="2"/>
    <rect x="547" y="644" width="16" height="5" rx="2"/>
  </g>

  <!-- Icon: blade server -->
  <g stroke="#4D4D4D" stroke-width="3" fill="none">
    <rect x="684" y="600" width="62" height="56" rx="4"/>
    <line x1="684" y1="619" x2="746" y2="619"/>
    <line x1="684" y1="638" x2="746" y2="638"/>
  </g>
  <g fill="#4D4D4D">
    <circle cx="695" cy="610" r="3"/>
    <circle cx="695" cy="629" r="3"/>
    <circle cx="695" cy="648" r="3"/>
    <rect x="705" y="607" width="16" height="5" rx="2"/>
    <rect x="705" y="626" width="16" height="5" rx="2"/>
    <rect x="705" y="645" width="16" height="5" rx="2"/>
  </g>

  <!-- Icon: switch -->
  <g stroke="#4D4D4D" stroke-width="3" fill="none">
    <line x1="906" y1="602" x2="946" y2="602"/>
    <path d="M940 596 L948 602 L940 608" fill="none"/>
    <line x1="962" y1="612" x2="922" y2="612"/>
    <path d="M928 606 L920 612 L928 618" fill="none"/>
    <rect x="906" y="626" width="56" height="28" rx="4"/>
  </g>
  <g fill="#4D4D4D">
    <circle cx="918" cy="640" r="2.5"/>
    <circle cx="931" cy="640" r="2.5"/>
    <circle cx="944" cy="640" r="2.5"/>
  </g>

  <!-- Icon: router -->
  <g stroke="#4D4D4D" stroke-width="3" fill="none">
    <line x1="1078" y1="626" x2="1070" y2="598"/>
    <line x1="1118" y1="626" x2="1126" y2="598"/>
    <rect x="1064" y="626" width="68" height="28" rx="6"/>
    <path d="M1088 612 a14 14 0 0 1 20 0" fill="none"/>
  </g>
  <g fill="#4D4D4D">
    <circle cx="1082" cy="640" r="2.5"/>
    <circle cx="1096" cy="640" r="2.5"/>
    <circle cx="1110" cy="640" r="2.5"/>
  </g>

  <!-- Icon: storage cylinder -->
  <g stroke="#4D4D4D" stroke-width="3" fill="none">
    <ellipse cx="1326" cy="604" rx="42" ry="13"/>
    <line x1="1284" y1="604" x2="1284" y2="650"/>
    <line x1="1368" y1="604" x2="1368" y2="650"/>
    <path d="M1284 650 a42 13 0 0 0 84 0" fill="none"/>
  </g>

  <!-- Sub labels -->
  <g font-size="22" fill="#595959" text-anchor="middle">
    <text x="380" y="736">Rack</text>
    <text x="549" y="736">Tower</text>
    <text x="715" y="736">Blade...</text>
    <text x="934" y="736">Switch</text>
    <text x="1098" y="736">Router</text>
    <text x="1326" y="736">SAN/NAS...</text>
  </g>
</svg>
