<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="dt dd" font-family="Inter, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<title id="dt">Enterprise AI Service Scenario</title><desc id="dd">The enterprise deploys and manages model services in a unified manner, providing model APIs, dedicated inference services, and knowledge Q&amp;A apps to subsidiaries and business units, with usage metered per organization.</desc>
