<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="dt dd" font-family="Inter, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<title id="dt">Park &amp; Regional Token Service Scenario</title><desc id="dd">Compute resources across organizations, architectures, and data centers are managed and scheduled in a unified manner, converted into standardized Token services for park enterprises and regional users on demand and pay-as-you-go.</desc>
<defs><linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#fcfdff"/><stop offset="1" stop-color="#f6f4fe"/></linearGradient><linearGradient id="blue-tag" x2="1" y2="1"><stop stop-color="#f1f7ff"/><stop offset="1" stop-color="#e5eeff"/></linearGradient><linearGradient id="indigo-tag" x2="1" y2="1"><stop stop-color="#f2f5ff"/><stop offset="1" stop-color="#e8ebff"/></linearGradient><linearGradient id="purple-tag" x2="1" y2="1"><stop stop-color="#f7f2ff"/><stop offset="1" stop-color="#eee5ff"/></linearGradient></defs>
<rect x="0" y="0" width="880" height="300" fill="url(#canvas)" stroke="none"/>
<g aria-label="Distributed Compute">
<rect x="18" y="18" width="200" height="40" rx="10" fill="url(#blue-tag)" stroke="#cdddfe"/><rect x="31" y="28" width="3" height="20" rx="1.5" fill="#2852a3" stroke="none"/><text x="118.0" y="38" text-anchor="middle" dominant-baseline="central" font-size="15.0" font-weight="720" fill="#2852a3">Distributed Compute</text>
<rect x="18" y="66" width="200" height="216" rx="11" fill="#edf4ff" stroke="#cdddfe"/>
<rect x="30" y="78" width="176" height="52" rx="7" fill="#fff" stroke="#dbe7fd"/><text x="118.0" y="94" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="680" fill="#242b51">Cross-org</text><text x="118.0" y="114" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="500" fill="#526186">Multi-party data centers</text><rect x="30" y="141" width="176" height="52" rx="7" fill="#fff" stroke="#dbe7fd"/><text x="118.0" y="157" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="680" fill="#242b51">Cross-arch</text><text x="118.0" y="177" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#526186">x86 / ARM / NPU</text><rect x="30" y="204" width="176" height="52" rx="7" fill="#fff" stroke="#dbe7fd"/><text x="118.0" y="220" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="680" fill="#242b51">Cross-region</text><text x="118.0" y="240" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="500" fill="#526186">Interconnected data centers</text>
</g>
<g aria-label="Unified Mgmt &amp; Smart Scheduling">
<rect x="278" y="18" width="300" height="40" rx="10" fill="url(#indigo-tag)" stroke="#d5dcff"/><rect x="291" y="28" width="3" height="20" rx="1.5" fill="#3d51a9" stroke="none"/><text x="428.0" y="38" text-anchor="middle" dominant-baseline="central" font-size="15.0" font-weight="720" fill="#3d51a9">Unified Mgmt &amp; Smart Scheduling</text>
<rect x="278" y="66" width="300" height="216" rx="11" fill="#eef1ff" stroke="#d5dcff"/>
<rect x="290" y="80" width="131" height="64" rx="7" fill="#fff" stroke="#dde3fb"/><text x="355.5" y="96" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="680" fill="#242b51">Resource Pooling</text><text x="355.5" y="116" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="500" fill="#526186">Heterogeneous unified pool</text><rect x="435" y="80" width="131" height="64" rx="7" fill="#fff" stroke="#dde3fb"/><text x="500.5" y="96" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="680" fill="#242b51">Smart Routing</text><text x="500.5" y="116" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="500" fill="#526186">Load balancing &amp; failover</text><rect x="290" y="154" width="131" height="64" rx="7" fill="#fff" stroke="#dde3fb"/><text x="355.5" y="170" text-anchor="middle" dominant-baseline="central" font-size="13.0" font-weight="680" fill="#242b51">Elastic Sharing</text><text x="355.5" y="190" text-anchor="middle" dominant-baseline="central" font-size="10.0" font-weight="500" fill="#526186">On-demand allocation</text><rect x="435" y="154" width="131" height="64" rx="7" fill="#fff" stroke="#dde3fb"/><text x="500.5" y="170" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="680" fill="#242b51">Orchestration</text><text x="500.5" y="190" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="500" fill="#526186">Cross-center coordination</text><rect x="290" y="228" width="276" height="40" rx="7" fill="#fff" stroke="#dde3fb"/><text x="428.0" y="248.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="680" fill="#242b51">Standardized Token Services</text>
</g>
