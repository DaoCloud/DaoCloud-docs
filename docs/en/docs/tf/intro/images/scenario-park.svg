<rect x="638" y="66" width="224" height="216" rx="11" fill="#f3efff" stroke="#ddd0fb"/>
<rect x="650" y="78" width="200" height="52" rx="7" fill="#fff" stroke="#ddd0fb"/><text x="750.0" y="94" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="680" fill="#242b51">Park Enterprises</text><text x="750.0" y="114" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#526186">Model API / instances</text><rect x="650" y="141" width="200" height="52" rx="7" fill="#fff" stroke="#ddd0fb"/><text x="750.0" y="157" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="680" fill="#242b51">Industry Users</text><text x="750.0" y="177" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="500" fill="#526186">Dedicated inference services</text><rect x="650" y="204" width="200" height="52" rx="7" fill="#fff" stroke="#ddd0fb"/><text x="750.0" y="220" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="680" fill="#242b51">Regional Users</text><text x="750.0" y="240" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#526186">On-demand &amp; pay-as-you-go</text>
</g>
