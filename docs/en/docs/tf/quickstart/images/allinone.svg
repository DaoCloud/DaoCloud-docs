  <text x="460" text-anchor="middle" y="62" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="12.5" fill="#6b7688">The seed node hosts global services and the installation engine · workload clusters are created and joined as needed</text>

