<svg xmlns="http://www.w3.org/2000/svg" width="920" height="510" viewBox="0 0 920 510" role="img" aria-labelledby="title desc">
  <title id="title">Token Factory Deployment Architecture</title>
  <desc id="desc">The seed node and global service cluster host Docker Registry, ChartMuseum, Kubernetes Master (platform and logging components), kubean, and core platform components; workload clusters are created and joined as needed.</desc>
  <style>
    /* Dark mode adaptation: site palette defaults to auto (follows OS). CSS rules override presentation attributes. */
    @media (prefers-color-scheme: dark) {
      rect[x="0.5"] { fill: rgba(255,255,255,0.015); stroke: #2e3540; }
      /* surfaces */
      [fill="#ffffff"]:not([x="0.5"]) { fill: #232936; }
      [fill="#e6f7ec"] { fill: #1b2c22; }
      [fill="#fff3e0"] { fill: #2b2519; }
      /* text */
      [fill="#1a2330"] { fill: #e6ebf2; }
      [fill="#5c6775"] { fill: #b6bfcb; }
      [fill="#8a96a8"] { fill: #7e8794; }
      [fill="#2e7d32"] { fill: #81c784; }
      [fill="#e65100"] { fill: #ffb74d; }
      /* strokes */
      [stroke="#66bb6a"] { stroke: #4caf50; }
      [stroke="#ffa726"] { stroke: #ffb74d; }
      [stroke="#43a047"] { stroke: #66bb6a; }
      [stroke="#c8e6c9"] { stroke: #2c5940; }
      [stroke="#ffe0b2"] { stroke: #5c4a26; }
    }
  </style>

  <rect x="0.5" y="0.5" width="919" height="509" rx="14" fill="#ffffff" stroke="#e6eaf1"/>

