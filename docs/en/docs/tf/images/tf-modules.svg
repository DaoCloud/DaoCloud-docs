  <text x="44" y="64" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="12.5" fill="#6b7688">User / admin dual view · four capability layers · 14 built-in modules — turning compute into metered, tradable Tokens</text>

