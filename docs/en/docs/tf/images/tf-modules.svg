<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">d.run Token Factory at a Glance</title>
  <desc id="desc">d.run Token Factory consists of user and admin views, four capability layers, and Lego-style composable modules. Cloud-Native AI: LLM Studio (Hydra), AI Apps (dak), InferX Suite, Compute Cloud (zestu). Cloud-Native Infrastructure: Container Management, Image Registry, Device Management, Cloud Native Networking, Cloud Native Storage. Operations: Cockpit, Copilot Workbench, Billing Center. O&amp;M: Insight, Global Management. It turns heterogeneous compute into metered, operable Token services.</desc>
