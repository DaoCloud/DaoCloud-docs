<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1255 1072" width="100%" role="img" aria-label="DCE Container Management logical architecture" font-family="'Noto Sans','Helvetica Neue',Arial,system-ui,sans-serif">
