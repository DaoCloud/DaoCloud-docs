<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" width="100%" role="img" aria-labelledby="ktitle kdesc" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,system-ui,sans-serif">
  <title id="ktitle">DCE Container Management Logical Architecture</title>
  <desc id="kdesc">The container management logical architecture, from top to bottom: application layer (microservices, app modernization, big data, database apps); Open API; four management domains (cluster management, app management, policy management, O&amp;M management); multi-cloud / hybrid cloud container management; container cloud platform (DaoCloud, Kubernetes, OpenShift, and more); data center (public cloud, private cloud, dedicated cloud); underlying infrastructure (compute + storage + network).</desc>
