<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="t d">
  <title id="t">DCE 5.0 OS support matrix</title>
  <desc id="d">Supported operating systems by OS family and CPU architecture. Red Hat family: RHEL 9.2, Rocky Linux 9.2, openEuler 22.03, NeoKylin AS V7U6, Oracle Linux R9/R8 U1, TencentOS Server 3.1. Debian family: Ubuntu 22.04, Ubuntu 24.04, UOS V20 (1020a). Kylin family on ARM64: Kylin OS V10 SP2 and SP3. Unlisted distributions needing a custom OS package: UOS V20 (1050d), AnolisOS 8.8, Ubuntu 22.04.3, and any other Linux. Grey chips use the standard install procedure, blue chips have a dedicated guide in this section, yellow chips need a custom OS package.</desc>
