<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="t d">
  <title id="t">Kernel version and component capabilities</title>
  <desc id="d">Tested kernels of supported distributions compared with four component minimums: GPU capability requires ≥ 5.15, Cilium requires ≥ 5.12, Merbridge requires ≥ 5.7, and kube-proxy ipvs mode is recommended at ≥ 5.9. Distributions on 4.19 and 5.4 kernels miss Cilium, Merbridge, and the ipvs recommendation; openEuler 5.10 meets Merbridge and ipvs; RHEL/Rocky 5.14 also meets Cilium; Oracle Linux and Ubuntu on 5.15 meet all four.</desc>
  <rect x="0.5" y="0.5" width="999" height="469" rx="14" fill="#ffffff" stroke="#e6eaf1"/>
  <text x="60" y="46" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#1a2330">Kernel Version Decides Available Capabilities</text>
  <text x="60" y="70" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#6b7688">Tested kernels from Deployment Requirements compared with component minimums; ✓ means the kernel meets the minimum</text>
