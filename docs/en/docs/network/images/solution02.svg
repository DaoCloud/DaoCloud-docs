<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">Solution 2 architecture: Calico + Macvlan/SR-IOV/IPvlan + SpiderPool + Multus (cross-cluster with Submariner)</title>
  <desc id="desc">Two clusters achieve cross-cluster service discovery through Submariner and CoreDNS (Service Export / Service Import). In each cluster, Multus schedules multiple CNIs, Calico provides the Overlay network, Macvlan/SR-IOV/IPvlan provides the Underlay network, and SpiderPool with SpiderFlat manages IP allocation. Clusters communicate over IPSec or VXLAN. The bottom lists core capabilities: cross-cluster Pod connectivity, cross-cluster service discovery, static IP, dynamic virtual IP, Kubernetes standard network policies, multiple Pod NICs, and rich metrics.</desc>
