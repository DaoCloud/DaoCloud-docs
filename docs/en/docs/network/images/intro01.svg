<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Unified management and interconnection across clusters</title>
  <desc id="desc">Three Kubernetes clusters are managed by a unified control plane, delivering high availability, disaster recovery, multi-cloud delivery, network acceleration, microservices and security. The underlying infrastructure can be traditional networks (physical servers), SDN networks (virtual machines) or public cloud networks.</desc>
