<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 630" role="img" aria-labelledby="title desc">
  <title id="title">镜像仓库产品逻辑架构</title>
  <desc id="desc">自上而下分为四层：访问入口（用户 push/pull、CLI、Jenkins、Kubernetes、Tekton、Helm）；镜像仓库生命周期管理分为两个明确的分组，每组由角色标签与同组右侧的 4 项能力组成——工作空间组：镜像空间、仓库集成、镜像扫描、镜像回收；管理员组：创建托管 Harbor、仓库集成、镜像同步、镜像空间绑定工作空间；底层为仓库实例管理；控制流由仓库实例管理下发仓库管理与权限控制到本地数据中心 cluster01 和异地数据中心 cluster02 的镜像仓库；数据流为集群从本地镜像仓库拉取 image/chart 部署到集群或应用；两地镜像仓库之间通过镜像同步保持制品一致。橙色虚线为控制流，灰色实线为数据流。</desc>
