<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 710" role="img" aria-labelledby="title desc">
  <title id="title">云边协同产品架构</title>
  <desc id="desc">自上而下分为云、边、端三层。云端管理平面包含边缘节点管理（节点批量、节点组管理）、边缘应用管理（应用/模型部署、配置与密钥）、边缘设备管理（设备创建、设备孪生）、数据管理（消息端点、消息路由），底座为 Kubernetes 集群与操作系统；云端向边缘下发应用、配置与模型，边缘向云端上传数据与状态。边缘侧包含应用/模型层，边缘控制能力（资源控制、边缘运维、应用/模型部署、应用/模型日志、设备数据采集、设备协议转换、数据通道、消息路由），容器引擎与操作系统，以及 x86、ARM、网络、计算、存储等基础设施，弱网或离线时仍可自治运行。终端层为多协议终端（Modbus）、智能物联设备与 DMI 标准设备接口，通过设备接入与数据采集中继到边缘。橙色虚线表示应用/配置下发，蓝色实线表示数据/状态上传，灰色实线表示设备接入。</desc>
