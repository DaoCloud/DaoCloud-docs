  <path d="M 245 160 V 74 H 745 V 152" fill="none" stroke="#7e57c2" stroke-width="2" marker-start="url(#arrow-purple)" marker-end="url(#arrow-purple)"/>
  <text x="500" y="66" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="12" fill="#7e57c2">Service Export → Service Import</text>

