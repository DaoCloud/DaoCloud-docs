<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">方案二架构：Calico + Macvlan/SR-IOV/IPvlan + SpiderPool + Multus（Submariner 跨集群）</title>
  <desc id="desc">两个集群通过 Submariner 与 CoreDNS 实现跨集群服务发现（Service Export / Service Import）：每个集群内由 Multus 调度多 CNI，Calico 提供 Overlay 网络，Macvlan/SR-IOV/IPvlan 提供 Underlay 网络，SpiderPool 与 SpiderFlat 管理 IP 分配，集群间通过 IPSec/VXLAN 互通。底部列出核心能力：跨集群 Pod 联通、跨集群服务发现、固定静态 IP、动态虚拟 IP、K8s 标准网络策略、Pod 多网卡、丰富的 Metrics。</desc>
