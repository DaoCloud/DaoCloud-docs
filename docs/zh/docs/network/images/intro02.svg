<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">传统应用云原生化过程中的混合部署</title>
  <desc id="desc">两个 Kubernetes 集群分别承载对外访问与对内访问的 Pod，集群之间与 Pod 分组之间均可互通；右侧尚未上云的数据库、中间件等应用运行在物理机与虚拟机上，通过双向网络与集群互联。底层基础设施涵盖传统网络、SDN 网络与公有云网络。</desc>
