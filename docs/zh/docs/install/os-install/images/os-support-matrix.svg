
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="t d">
  <title id="t">DCE 5.0 操作系统支持矩阵</title>
  <desc id="d">按系统族与 CPU 架构两个维度列出 DCE 5.0 安装器支持的操作系统：Red Hat 系（RHEL 9.2、Rocky Linux 9.2、openEuler 22.03、NeoKylin AS V7U6、Oracle Linux R9/R8 U1、TencentOS Server 3.1）、Debian 系（Ubuntu 22.04、Ubuntu 24.04、UOS V20 1020a）、麒麟系 ARM64（银河麒麟 V10 SP2/SP3），以及需自制 OS package 的非清单发行版（UOS V20 1050d、AnolisOS 8.8、Ubuntu 22.04.3）。灰色为走标准安装文档，蓝色为有专用安装指南，黄色为需自制 OS package。</desc>
