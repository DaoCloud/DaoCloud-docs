<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="t d">
  <title id="t">内核版本与组件能力对照</title>
  <desc id="d">按发行版实测内核对照四项组件的内核下限：GPU 能力需 ≥ 5.15、Cilium 需 ≥ 5.12、Merbridge 需 ≥ 5.7、kube-proxy ipvs 模式建议 ≥ 5.9。4.19 与 5.4 内核的发行版不满足 Cilium、Merbridge 与 ipvs 建议；openEuler 5.10 满足 Merbridge 与 ipvs；RHEL/Rocky 5.14 另满足 Cilium；Oracle Linux 与 Ubuntu 的 5.15 内核四项全部满足。</desc>
  <rect x="0.5" y="0.5" width="999" height="469" rx="14" fill="#ffffff" stroke="#e6eaf1"/>
  <text x="60" y="46" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="19" font-weight="600" fill="#1a2330">内核版本决定可用能力</text>
  <text x="60" y="70" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="12.5" fill="#6b7688">发行版实测内核（取自《部署要求》）与组件内核下限的对照，✓ 表示该内核满足下限</text>
