<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1280" viewBox="0 0 1920 1280" role="img" aria-labelledby="title desc">
<title id="title">DCE 小助手逻辑架构</title><desc id="desc">上层用户与场景；中层 DCE 小助手和独立模型服务；下层 DCE 模块。小助手负责组织任务、加载 Skills、调用工具获取平台数据，并向用户呈现判断、依据和建议。模型通过 API 接收上下文与工具结果，返回推理、回答和工具调用请求。</desc>
