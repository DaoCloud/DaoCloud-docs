    <rect x="1244" y="152" width="136" height="80" rx="8" fill="#F5F7FA"/>
    <text x="1256" y="174" font-size="14" fill="#2E7CF6">Application</text>
    <g fill="#ffffff" stroke="#C9D4E0">
      <rect x="1254" y="186" width="34" height="22" rx="6"/>
      <rect x="1296" y="186" width="34" height="22" rx="6"/>
      <rect x="1338" y="186" width="34" height="22" rx="6"/>
    </g>
    <g font-size="12" fill="#333" text-anchor="middle">
      <text x="1271" y="201">pod</text><text x="1313" y="201">pod</text><text x="1355" y="201">pod</text>
    </g>
    <rect x="1244" y="244" width="136" height="80" rx="8" fill="#F5F7FA"/>
    <text x="1256" y="266" font-size="14" fill="#2E7CF6">Application</text>
    <g fill="#ffffff" stroke="#C9D4E0">
      <rect x="1254" y="278" width="34" height="22" rx="6"/>
      <rect x="1296" y="278" width="34" height="22" rx="6"/>
      <rect x="1338" y="278" width="34" height="22" rx="6"/>
    </g>
    <g font-size="12" fill="#333" text-anchor="middle">
      <text x="1271" y="293">pod</text><text x="1313" y="293">pod</text><text x="1355" y="293">pod</text>
    </g>
  </g>

  <!-- 底部 Tekton / Jenkins -->
  <rect x="500" y="310" width="580" height="72" rx="14" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="8 6"/>
  <g transform="translate(610,346)">
    <g fill="#F7A8C6">
      <circle cx="-9" cy="-8" r="8"/><circle cx="9" cy="-8" r="8"/><circle cx="0" cy="2" r="9"/>
      <circle cx="-11" cy="6" r="7"/><circle cx="11" cy="6" r="7"/>
    </g>
    <circle r="5" fill="#E24B8D"/>
    <text x="24" y="10" font-size="24" font-weight="800" fill="#2F55A0">TEKTON</text>
  </g>
  <g transform="translate(850,346)">
    <circle r="16" fill="#D3382F"/>
    <circle cx="0" cy="-3" r="8" fill="#F6C9A8"/>
    <path d="M-8,8 Q0,2 8,8 L8,12 L-8,12 Z" fill="#2E3B4E"/>
