    <polygon points="660,108 810,108 838,135 810,162 660,162 688,135"/>
    <polygon points="830,108 980,108 1008,135 980,162 830,162 858,135"/>
    <polygon points="1000,108 1150,108 1178,135 1150,162 1000,162 1028,135"/>
  </g>
  <g font-size="17" fill="#111" text-anchor="middle">
