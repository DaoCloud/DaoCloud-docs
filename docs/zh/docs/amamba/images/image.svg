<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 442" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="bk" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0L9,4L0,8Z" fill="#1a1a1a"/></marker>
  </defs>
  <rect width="1400" height="442" fill="#ffffff"/>

