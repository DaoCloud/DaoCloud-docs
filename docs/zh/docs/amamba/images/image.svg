    <g transform="translate(1258,132)">
      <path d="M0,-16 L11,-11 L16,0 L11,11 L0,16 L-11,11 L-16,0 L-11,-11 Z" fill="#326CE5" transform="scale(0.9)"/>
      <circle r="6" fill="none" stroke="#fff" stroke-width="2.5"/>
