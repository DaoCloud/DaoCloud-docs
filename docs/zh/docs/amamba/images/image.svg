  <rect x="202" y="60" width="106" height="322" rx="12" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- GitHub -->
  <g transform="translate(255,118)">
    <circle r="26" fill="#111"/>
    <circle cx="0" cy="2" r="10" fill="#ffffff"/>
    <path d="M-8,-6 L-5,-14 L-1,-8 H1 L5,-14 L8,-6 Z" fill="#ffffff"/>
    <path d="M-9,8 Q0,14 9,8 L9,3 Q0,8 -9,3 Z" fill="#ffffff"/>
  </g>
  <!-- GitLab -->
  <g transform="translate(255,190)">
