<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1112 559" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0L9,4L0,8Z" fill="#1a1a1a"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0L9,4L0,8Z" fill="#6FA843"/></marker>
  </defs>
  <rect width="1112" height="559" fill="#ffffff"/>

  <!-- 两个虚线分组容器 -->
  <rect x="10" y="105" width="870" height="145" fill="#ECECEC" stroke="#AAAAAA" stroke-width="1.5" stroke-dasharray="7 5"/>
  <rect x="10" y="285" width="870" height="260" fill="#ECECEC" stroke="#AAAAAA" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="897" y="192" font-size="27" font-weight="600" fill="#111">映射企业项目</text>
  <text x="897" y="422" font-size="27" font-weight="600" fill="#111">资源</text>

  <!-- 企业-某部门 -->
  <rect x="355" y="12" width="190" height="70" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
  <text x="450" y="54" font-size="21" fill="#111" text-anchor="middle">企业-某部门</text>

  <!-- 顶部连线 -->
  <path d="M450 82 V152" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ab)"/>
  <path d="M145 120 H745" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
  <path d="M145 120 V152" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ab)"/>
  <path d="M745 120 V152" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ab)"/>

  <!-- workspace 框 -->
  <rect x="60" y="158" width="170" height="72" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
  <text x="145" y="201" font-size="21" fill="#111" text-anchor="middle">workspace1</text>
  <rect x="362" y="158" width="170" height="72" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
  <text x="447" y="201" font-size="21" fill="#111" text-anchor="middle">workspace2</text>
  <rect x="660" y="158" width="170" height="72" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
  <text x="745" y="201" font-size="21" fill="#111" text-anchor="middle">workspace3</text>

  <!-- workspace 到 cluster 的连线（workspace2 绿色） -->
  <path d="M145 230 V306" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ab)"/>
  <path d="M745 230 V270 H447" fill="none" stroke="#6FA843" stroke-width="2"/>
  <path d="M447 230 V306" fill="none" stroke="#6FA843" stroke-width="2" marker-end="url(#ag)"/>
  <path d="M745 270 V306" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ab)"/>

  <!-- cluster 框 -->
  <rect x="40" y="312" width="210" height="210" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
  <text x="50" y="340" font-size="20" fill="#111">cluster1</text>
  <rect x="340" y="312" width="210" height="210" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
  <text x="350" y="340" font-size="20" fill="#111">cluster2</text>
  <rect x="635" y="312" width="210" height="210" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
  <text x="645" y="340" font-size="20" fill="#111">cluster2</text>

  <!-- namespace 双线框 -->
  <g stroke="#1a1a1a" fill="#ffffff">
    <rect x="70" y="362" width="150" height="56" stroke-width="2"/>
    <rect x="76" y="368" width="138" height="44" stroke-width="1.6"/>
    <rect x="70" y="442" width="150" height="56" stroke-width="2"/>
    <rect x="76" y="448" width="138" height="44" stroke-width="1.6"/>
    <rect x="370" y="362" width="150" height="56" stroke-width="2"/>
    <rect x="376" y="368" width="138" height="44" stroke-width="1.6"/>
    <rect x="665" y="362" width="150" height="56" stroke-width="2"/>
    <rect x="671" y="368" width="138" height="44" stroke-width="1.6"/>
    <rect x="665" y="442" width="150" height="56" stroke-width="2"/>
    <rect x="671" y="448" width="138" height="44" stroke-width="1.6"/>
  </g>
  <g font-size="19" fill="#111" text-anchor="middle">
    <text x="145" y="397">namespace1</text>
    <text x="145" y="477">namespace2</text>
    <text x="445" y="397">namespace1</text>
    <text x="740" y="397">namespace1</text>
    <text x="740" y="477">namespace2</text>
  </g>
</svg>
