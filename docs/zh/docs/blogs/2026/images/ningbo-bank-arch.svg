<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif">
  <title>宁波银行云原生 AI 架构：四层架构，实线为本期范围，虚线为规划范围</title>
  <desc>分层架构图。顶部为智能业务应用层；其下为大模型服务平台（推理服务治理层 · Higress 与模型管理基座层）；再下为金融级 Kubernetes 底座（HAMi、Kueue〔规划中〕、Spiderpool）；底部为异构算力基础设施（GPU 算力资源池与国产算力资源池）。图例：实线边框为本期范围，虚线边框为规划范围。</desc>

  <!-- 背景 -->
  <rect width="1080" height="580" fill="#f8fafc"/>

  <!-- ===================== 第 1 层：智能业务应用层 ===================== -->
  <rect x="16" y="16" width="1048" height="96" rx="6" fill="#ffffff" stroke="#c3cfdd" stroke-width="1.5"/>
  <rect x="28" y="28" width="176" height="72" rx="6" fill="#eef3f9" stroke="#d5dfeb" stroke-width="1"/>
  <text x="116" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#1c3d5a">智能业务</text>
  <text x="116" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#1c3d5a">应用层</text>
  <g font-size="12.5" fill="#2d4a66">
    <rect x="220" y="46" width="118" height="36" rx="5" fill="#f6f8fb" stroke="#d5dfeb"/>
    <text x="279" y="68" text-anchor="middle">智能客服</text>
    <rect x="350" y="46" width="118" height="36" rx="5" fill="#f6f8fb" stroke="#d5dfeb"/>
    <text x="409" y="68" text-anchor="middle">智能风控</text>
    <rect x="480" y="46" width="118" height="36" rx="5" fill="#f6f8fb" stroke="#d5dfeb"/>
    <text x="539" y="68" text-anchor="middle">运营审计</text>
    <rect x="610" y="46" width="118" height="36" rx="5" fill="#f6f8fb" stroke="#d5dfeb"/>
    <text x="669" y="68" text-anchor="middle">文本解析</text>
    <rect x="740" y="46" width="118" height="36" rx="5" fill="#f6f8fb" stroke="#d5dfeb"/>
    <text x="799" y="68" text-anchor="middle">智能营销</text>
  </g>

  <!-- ===================== 第 2 层：大模型服务平台 ===================== -->
  <rect x="16" y="124" width="1048" height="182" rx="6" fill="#ffffff" stroke="#c3cfdd" stroke-width="1.5"/>
  <rect x="28" y="136" width="176" height="158" rx="6" fill="#eef3f9" stroke="#d5dfeb" stroke-width="1"/>
  <text x="116" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#1c3d5a">大模型</text>
  <text x="116" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#1c3d5a">服务平台</text>

  <text x="220" y="152" font-size="13.5" font-weight="700" fill="#1c3d5a">推理服务治理层 · Higress</text>
  <g font-size="12.5" fill="#2d4a66">
    <rect x="220" y="162" width="100" height="34" rx="5" fill="#f6f8fb" stroke="#d5dfeb"/>
    <text x="270" y="183" text-anchor="middle">统一入口</text>
    <rect x="332" y="162" width="100" height="34" rx="5" fill="#f6f8fb" stroke="#d5dfeb"/>
    <text x="382" y="183" text-anchor="middle">模型路由</text>
    <rect x="444" y="162" width="100" height="34" rx="5" fill="#f6f8fb" stroke="#d5dfeb"/>
    <text x="494" y="183" text-anchor="middle">流量权重</text>
    <rect x="556" y="162" width="100" height="34" rx="5" fill="#f6f8fb" stroke="#d5dfeb"/>
    <text x="606" y="183" text-anchor="middle">健康检查</text>
    <rect x="668" y="162" width="100" height="34" rx="5" fill="#f6f8fb" stroke="#d5dfeb"/>
    <text x="718" y="183" text-anchor="middle">故障隔离</text>
    <rect x="780" y="162" width="118" height="34" rx="5" fill="#f6f8fb" stroke="#d5dfeb"/>
    <text x="839" y="183" text-anchor="middle">运行时可观测</text>
    <rect x="910" y="162" width="100" height="34" rx="5" fill="#f6f8fb" stroke="#d5dfeb"/>
    <text x="960" y="183" text-anchor="middle">安全管控</text>
  </g>

  <line x1="220" y1="212" x2="1044" y2="212" stroke="#d5dfeb" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="220" y="236" font-size="13.5" font-weight="700" fill="#1c3d5a">模型管理基座层</text>
  <g font-size="12.5" fill="#2d4a66">
    <rect x="220" y="246" width="150" height="34" rx="5" fill="#f6f8fb" stroke="#d5dfeb"/>
    <text x="295" y="267" text-anchor="middle">模型生命周期管理</text>
    <rect x="382" y="246" width="164" height="34" rx="5" fill="#f6f8fb" stroke="#d5dfeb"/>
    <text x="464" y="267" text-anchor="middle">模型打标与分类分组</text>
    <rect x="558" y="246" width="110" height="34" rx="5" fill="#f6f8fb" stroke="#d5dfeb"/>
    <text x="613" y="267" text-anchor="middle">访问控制</text>
    <rect x="680" y="246" width="110" height="34" rx="5" fill="#f6f8fb" stroke="#d5dfeb"/>
    <text x="735" y="267" text-anchor="middle">模型市场</text>
  </g>

  <!-- ===================== 第 3 层：金融级 Kubernetes 底座 ===================== -->
  <rect x="16" y="318" width="1048" height="126" rx="6" fill="#ffffff" stroke="#c3cfdd" stroke-width="1.5"/>
  <rect x="28" y="330" width="176" height="102" rx="6" fill="#eef3f9" stroke="#d5dfeb" stroke-width="1"/>
  <text x="116" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#1c3d5a">金融级</text>
  <text x="116" y="384" text-anchor="middle" font-size="14" font-weight="700" fill="#1c3d5a">Kubernetes 底座</text>
  <text x="116" y="408" text-anchor="middle" font-size="11" fill="#5a7184">多集群管理</text>

  <!-- HAMi -->
  <rect x="220" y="336" width="260" height="66" rx="6" fill="#f6f8fb" stroke="#9db4c8" stroke-width="1.5"/>
  <text x="236" y="362" font-size="14" font-weight="700" fill="#1c3d5a">HAMi</text>
  <text x="236" y="382" font-size="11.5" fill="#5a7184">异构算力管理与调度</text>
  <!-- Kueue（规划中，虚线） -->
  <rect x="496" y="336" width="288" height="66" rx="6" fill="#f6f8fb" stroke="#9db4c8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="512" y="362" font-size="14" font-weight="700" fill="#1c3d5a">Kueue</text>
  <text x="512" y="382" font-size="11.5" fill="#5a7184">队列与配额管理〔规划中〕</text>
  <!-- Spiderpool -->
  <rect x="800" y="336" width="244" height="66" rx="6" fill="#f6f8fb" stroke="#9db4c8" stroke-width="1.5"/>
  <text x="816" y="362" font-size="14" font-weight="700" fill="#1c3d5a">Spiderpool</text>
  <text x="816" y="382" font-size="11.5" fill="#5a7184">网络管理</text>

  <text x="220" y="426" font-size="12" fill="#5a7184">统一纳管 GPU 与国产加速器资源池</text>

  <!-- ===================== 第 4 层：异构算力基础设施 ===================== -->
  <rect x="16" y="456" width="1048" height="94" rx="6" fill="#ffffff" stroke="#c3cfdd" stroke-width="1.5"/>
  <rect x="28" y="468" width="176" height="70" rx="6" fill="#eef3f9" stroke="#d5dfeb" stroke-width="1"/>
  <text x="116" y="492" text-anchor="middle" font-size="14" font-weight="700" fill="#1c3d5a">异构算力基础设施</text>
  <text x="116" y="514" text-anchor="middle" font-size="10.5" fill="#5a7184">资源池 · 网络 · 存储</text>

  <rect x="220" y="472" width="402" height="54" rx="6" fill="#f6f8fb" stroke="#9db4c8" stroke-width="1.5"/>
  <text x="236" y="494" font-size="13.5" font-weight="700" fill="#1c3d5a">GPU 算力资源池</text>
  <text x="236" y="514" font-size="11.5" fill="#5a7184">通用 GPU 服务器</text>
  <rect x="638" y="472" width="406" height="54" rx="6" fill="#f6f8fb" stroke="#9db4c8" stroke-width="1.5"/>
  <text x="654" y="494" font-size="13.5" font-weight="700" fill="#1c3d5a">国产算力资源池</text>
  <text x="654" y="514" font-size="11.5" fill="#5a7184">国产加速器服务器</text>

  <text x="220" y="542" font-size="12" fill="#5a7184">高速网络与分布式存储，集中部署于金融私有云</text>

  <!-- ===================== 图例 ===================== -->
  <rect x="150" y="562" width="26" height="12" fill="#ffffff" stroke="#9db4c8" stroke-width="1.5"/>
  <text x="184" y="572" font-size="11.5" fill="#5a7184">实线边框：本期范围</text>
  <rect x="620" y="562" width="26" height="12" fill="#ffffff" stroke="#9db4c8" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="654" y="572" font-size="11.5" fill="#5a7184">虚线边框：规划范围</text>
</svg>
