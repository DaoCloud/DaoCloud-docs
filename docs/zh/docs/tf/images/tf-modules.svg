<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">d.run Token 工厂：模块与场景全景</title>
  <desc id="desc">d.run Token 工厂由用户视图与管理员视图两个视角、四层能力、14 个内置模块组成。云原生 AI 层：大模型服务平台 Hydra、AI 应用 dak、推理加速服务 InferX、算力云 zestu；云原生底座层：容器管理、镜像仓库、设备管理、云原生网络、云原生存储；运营管理层：驾驶舱、Copilot、费用中心；运维管理层：可观测性、全局管理。把异构算力转化为可计量、可交易的 Token 服务。</desc>

  <rect x="0.5" y="0.5" width="999" height="539" rx="14" fill="#ffffff" stroke="#e6eaf1"/>

