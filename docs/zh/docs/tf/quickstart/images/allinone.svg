<svg xmlns="http://www.w3.org/2000/svg" width="920" height="510" viewBox="0 0 920 510" role="img" aria-labelledby="title desc">
  <title id="title">Token 工厂部署架构</title>
  <desc id="desc">火种节点与全局服务集群承载 Docker Registry、ChartMuseum、Kubernetes Master（功能组件及日志组件）、kubean 与平台核心组件；工作集群通过接入创建的方式纳入管理，可按需扩展。</desc>
