<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">d.run AI 操作系统：模块与场景全景</title>
  <desc id="desc">d.run AI 操作系统由四层能力、13 个内置模块组成。云原生 AI 层：大模型服务平台 Hydra、AI Lab、推理加速服务 InferX、ClawOS；云原生底座层：容器管理 kpanda、设备管理 topohub、镜像仓库 kangaroo、云原生网络 mspider、云原生存储；运营管理层：驾驶舱 crane、Copilot；运维管理层：可观测性 insight、全局管理 ghippo。自下而上把异构算力转化为可计量的 AI 生产力。</desc>

  <rect x="0.5" y="0.5" width="999" height="539" rx="14" fill="#ffffff" stroke="#e6eaf1"/>

  <!-- 标题 -->
  <text x="44" y="42" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="19" font-weight="600" fill="#1a2330">d.run AI 操作系统：模块与场景全景</text>
  <text x="44" y="64" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="12.5" fill="#6b7688">四层能力、13 个内置模块 —— 自下而上把异构算力转化为可计量的 AI 生产力</text>

