<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">企业知识智能体场景图</title>
<desc id="desc">业务人员通过协作工具与受支持的 OpenClaw 实例交互，实例调用模型服务并按配置访问企业知识与业务工具，管理员管理 Skill、网络策略和实例运行状态。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#4d79a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowSoft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#8aa8c7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <style>
    .title{font:600 20px 'Noto Sans SC','PingFang SC',sans-serif;fill:#1e446c}
    .label{font:600 17px 'Noto Sans SC','PingFang SC',sans-serif;fill:#234c75}
    .body{font:15px 'Noto Sans SC','PingFang SC',sans-serif;fill:#55708d}
    .small{font:13px 'Noto Sans SC','PingFang SC',sans-serif;fill:#6d849e}
    .micro{font:12px 'Noto Sans SC','PingFang SC',sans-serif;fill:#7188a0}
    .panel{fill:#fff;stroke:#c9d9e9;stroke-width:1.6}
    .panelBlue{fill:#f3f8fd;stroke:#9fbad5;stroke-width:1.7}
    .panelTint{fill:#f8fbff;stroke:#d5e2ef;stroke-width:1.4}
    .line{fill:none;stroke:#4d79a8;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .lineSoft{fill:none;stroke:#91abc5;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .icon{fill:none;stroke:#4c78a6;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .chip{fill:#eaf3fb;stroke:#c0d4e8;stroke-width:1}
    .accent{fill:#dcecf9;stroke:#87a9ca;stroke-width:1.4}
  </style>
</defs>
<rect x="1" y="1" width="1198" height="458" rx="18" fill="#fff" stroke="#dce6f0"/>
<text x="34" y="39" text-anchor="start" class="small">从协作入口连接企业知识与模型服务</text>
<rect x="32" y="104" width="236" height="238" rx="16" class="panel"/>
<text x="150" y="137" text-anchor="middle" class="label">业务人员</text>
<circle cx="150" cy="183" r="25" class="accent"/><path d="M108 250q4-42 42-42t42 42" class="icon"/>
<rect x="65" y="270" width="170" height="44" rx="10" class="chip"/>
<text x="150" y="298" text-anchor="middle" class="body">Teams</text>
<path d="M268 221 H326" class="line" marker-end="url(#arrow)"/>
<rect x="331" y="89" width="363" height="269" rx="19" class="panelBlue"/>
<text x="512" y="125" text-anchor="middle" class="title">ClawOS</text>
<rect x="447" y="151" width="130" height="101" rx="18" fill="#fff" stroke="#9fbad5" stroke-width="1.7"/><circle cx="489" cy="193" r="8" class="accent"/><circle cx="535" cy="193" r="8" class="accent"/><path d="M484 222q28 20 56 0 M512 151v-15 M501 136h22" class="icon"/>
<text x="512" y="278" text-anchor="middle" class="label">OpenClaw 实例</text>
<text x="512" y="308" text-anchor="middle" class="small">模型调用 · 任务执行</text>
<path d="M694 185 H749" class="line" marker-end="url(#arrow)"/>
<path d="M694 263 H749" class="lineSoft" marker-end="url(#arrowSoft)"/>
<rect x="755" y="75" width="405" height="123" rx="15" class="panel"/>
<text x="957" y="108" text-anchor="middle" class="label">企业知识与文档</text>
<path d="M807 133h34v42h-34z M814 143h20 M814 151h20 M814 159h14" class="icon"/>
<text x="865" y="147" text-anchor="start" class="body">制度 · 产品资料 · FAQ</text>
<text x="865" y="174" text-anchor="start" class="micro">由企业知识系统或技能接入</text>
