<rect x="331" y="378" width="829" height="52" rx="12" class="chip"/>
<text x="745.5" y="404" text-anchor="middle" dominant-baseline="middle" class="body">实例生命周期 · Skill 管理 · 网络策略 · 运行与用量观察</text>
<path d="M512 358V378" class="lineSoft"/>
</svg>
