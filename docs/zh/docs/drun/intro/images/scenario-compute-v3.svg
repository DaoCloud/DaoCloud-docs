<path d="M657 210 H699 V113 M699 113 V322" class="lineSoft"/>
<path d="M699 112 H735" class="lineSoft" marker-end="url(#arrowSoft)"/>
<rect x="741" y="73" width="420" height="78" rx="12" class="panel"/>
<circle cx="777" cy="102" r="9" class="accent"/><circle cx="797" cy="104" r="7" class="accent"/><path d="M761 130q2-17 16-17t16 17 M788 130q2-13 11-13t12 13" class="icon"/>
<text x="834" y="107" text-anchor="start" class="label">研发工作空间</text>
