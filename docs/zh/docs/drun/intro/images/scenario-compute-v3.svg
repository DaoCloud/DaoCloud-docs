<rect x="741" y="181" width="420" height="78" rx="12" class="panel"/>
<circle cx="777" cy="210" r="9" class="accent"/><circle cx="797" cy="212" r="7" class="accent"/><path d="M761 238q2-17 16-17t16 17 M788 238q2-13 11-13t12 13" class="icon"/>
<text x="834" y="215" text-anchor="start" class="label">训练工作空间</text>
<text x="834" y="239" text-anchor="start" class="small">训练任务 · GPU</text>
<path d="M699 328 H735" class="lineSoft" marker-end="url(#arrowSoft)"/>
<rect x="741" y="289" width="420" height="78" rx="12" class="panel"/>
<circle cx="777" cy="318" r="9" class="accent"/><circle cx="797" cy="320" r="7" class="accent"/><path d="M761 346q2-17 16-17t16 17 M788 346q2-13 11-13t12 13" class="icon"/>
<text x="834" y="323" text-anchor="start" class="label">推理服务空间</text>
<text x="834" y="347" text-anchor="start" class="small">模型部署 · 服务</text>
