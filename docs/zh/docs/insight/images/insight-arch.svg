  <text x="68" y="581" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#1a2330">通知渠道</text>
  <g font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="12" text-anchor="middle">
    <rect x="150" y="560" width="128" height="28" rx="7" fill="#ffffff" stroke="#cfd8e3"/>
    <text x="214" y="578" fill="#1a2330">邮件</text>
    <rect x="286" y="560" width="128" height="28" rx="7" fill="#ffffff" stroke="#cfd8e3"/>
