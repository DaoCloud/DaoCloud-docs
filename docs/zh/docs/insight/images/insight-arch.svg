    <rect x="422" y="560" width="128" height="28" rx="7" fill="#ffffff" stroke="#cfd8e3"/>
    <text x="486" y="578" fill="#1a2330">钉钉</text>
    <rect x="558" y="560" width="128" height="28" rx="7" fill="#ffffff" stroke="#cfd8e3"/>
    <text x="622" y="578" fill="#1a2330">Webhook</text>
    <rect x="694" y="560" width="128" height="28" rx="7" fill="#ffffff" stroke="#cfd8e3"/>
    <text x="758" y="578" fill="#1a2330">短信</text>
    <rect x="830" y="560" width="128" height="28" rx="7" fill="#ffffff" stroke="#cfd8e3"/>
    <text x="894" y="578" fill="#1a2330">···</text>
  </g>
</svg>
