  <rect x="32" y="852" width="1186" height="212" fill="#FFFFFF" stroke="#003FF9" stroke-width="5"/>
  <text x="50" y="884" font-size="19" font-weight="700" fill="#191A1B">数据中心</text>
  <rect x="50" y="898" width="366" height="46" fill="#FFFFFF" stroke="#191A1B" stroke-width="2"/>
