  <text x="50" y="692" font-size="19" font-weight="700" fill="#191A1B">容器云平台</text>
  <!-- DaoCloud：六边形分块 -->
  <polygon points="95.0,738.0 71.6,751.5 71.6,778.5 95.0,792.0 118.4,778.5 118.4,751.5" fill="#00CB59"/>
  <polygon points="102.5,752.0 87.5,752.0 80.0,765.0 87.5,778.0 102.5,778.0 110.0,765.0" fill="#FFFFFF"/>
  <line x1="95.0" y1="751.0" x2="95.0" y2="738.0" stroke="#FFFFFF" stroke-width="2.8"/>
  <line x1="82.9" y1="758.0" x2="71.6" y2="751.5" stroke="#FFFFFF" stroke-width="2.8"/>
  <line x1="82.9" y1="772.0" x2="71.6" y2="778.5" stroke="#FFFFFF" stroke-width="2.8"/>
  <line x1="95.0" y1="779.0" x2="95.0" y2="792.0" stroke="#FFFFFF" stroke-width="2.8"/>
  <line x1="107.1" y1="772.0" x2="118.4" y2="778.5" stroke="#FFFFFF" stroke-width="2.8"/>
  <line x1="107.1" y1="758.0" x2="118.4" y2="751.5" stroke="#FFFFFF" stroke-width="2.8"/>
  <text x="130" y="778" font-size="33" font-weight="700" fill="#191A1B">DaoCloud</text>
