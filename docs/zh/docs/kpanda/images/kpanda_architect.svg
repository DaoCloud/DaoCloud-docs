  <line x1="442.2" y1="738.3" x2="428.5" y2="741.5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="428.5" cy="741.5" r="2.6" fill="#FFFFFF"/>
  <line x1="445.4" y1="742.4" x2="439.3" y2="755.0" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="439.3" cy="755.0" r="2.6" fill="#FFFFFF"/>
  <line x1="450.6" y1="742.4" x2="456.7" y2="755.0" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="456.7" cy="755.0" r="2.6" fill="#FFFFFF"/>
  <line x1="453.8" y1="738.3" x2="467.5" y2="741.5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="467.5" cy="741.5" r="2.6" fill="#FFFFFF"/>
  <line x1="452.7" y1="733.3" x2="463.6" y2="724.5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="463.6" cy="724.5" r="2.6" fill="#FFFFFF"/>
  <circle cx="448" cy="737" r="5" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <text x="448" y="807" font-size="26" font-weight="700" fill="#191A1B" text-anchor="middle">kubernetes</text>
  <!-- OpenShift：三段断环 -->
  <path d="M732.0 707.9 A40 40 0 0 0 677.4 739.4" fill="none" stroke="#DF1F30" stroke-width="15"/>
  <path d="M677.4 750.6 A40 40 0 0 0 732.0 782.1" fill="none" stroke="#DF1F30" stroke-width="15"/>
  <path d="M741.6 776.5 A40 40 0 0 0 741.6 713.5" fill="none" stroke="#DF1F30" stroke-width="15"/>
  <text x="717" y="814" font-size="14.5" font-weight="700" fill="#191A1B" letter-spacing="1.2" text-anchor="middle">OPENSHIFT</text>
  <!-- 其他平台：蓝牛剪影 + 更多 -->
  <g fill="#1F46F9">
    <rect x="888" y="742" width="74" height="27" rx="3"/>
    <path d="M956 738 h22 a9 9 0 0 1 9 9 v19 a8 8 0 0 1 -8 8 h-23 z"/>
    <path d="M960 740 l-3 -16 l13 10 z"/>
    <path d="M983 742 l10 -13 l4 9 l-8 8 z"/>
