<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1255 1072" width="100%" role="img" aria-label="DCE 容器管理逻辑架构图" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Hiragino Sans GB','Source Han Sans SC',system-ui,sans-serif">
  <title>DCE 容器管理逻辑架构</title>
  <rect width="1255" height="1072" fill="#FFFFFF"/>
  <rect x="6" y="6" width="1243" height="646" rx="4" fill="none" stroke="#C9D2DC" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text x="36" y="44" font-size="26" font-weight="700" fill="#191A1B">容器管理</text>
  <!-- 第一层：四类应用（微服务 / 企业应用现代化 / 大数据 / 数据库应用） -->
  <rect x="32" y="62" width="288" height="124" fill="#FFFFFF" stroke="#0B3FE5" stroke-width="3"/>
  <text x="46" y="96" font-size="21" font-weight="700" fill="#191A1B">微服务</text>
  <rect x="46" y="128" width="124" height="50" fill="#003FF9"/>
  <text x="108.0" y="150" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">Spring</text>
  <text x="108.0" y="170" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">Cloud</text>
  <rect x="180" y="128" width="124" height="50" fill="#003FF9"/>
  <text x="242.0" y="160.0" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="middle">Dubbo</text>
  <rect x="331" y="62" width="288" height="124" fill="#FFFFFF" stroke="#0B3FE5" stroke-width="3"/>
  <text x="345" y="96" font-size="21" font-weight="700" fill="#191A1B">企业应用现代化</text>
  <rect x="345" y="128" width="124" height="50" fill="#003FF9"/>
  <text x="407.0" y="160.0" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="middle">.Net</text>
  <rect x="479" y="128" width="124" height="50" fill="#003FF9"/>
  <text x="541.0" y="160.0" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="middle">Java</text>
  <rect x="630" y="62" width="288" height="124" fill="#FFFFFF" stroke="#0B3FE5" stroke-width="3"/>
  <text x="644" y="96" font-size="21" font-weight="700" fill="#191A1B">大数据</text>
  <rect x="644" y="128" width="124" height="50" fill="#003FF9"/>
  <text x="706.0" y="160.0" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="middle">Hadoop</text>
  <rect x="778" y="128" width="124" height="50" fill="#003FF9"/>
  <text x="840.0" y="160.0" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="middle">Cbase</text>
  <rect x="929" y="62" width="288" height="124" fill="#FFFFFF" stroke="#0B3FE5" stroke-width="3"/>
  <text x="943" y="96" font-size="21" font-weight="700" fill="#191A1B">数据库应用</text>
  <rect x="943" y="128" width="124" height="50" fill="#003FF9"/>
  <text x="1005.0" y="160.0" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="middle">MySQL</text>
  <rect x="1077" y="128" width="124" height="50" fill="#003FF9"/>
  <text x="1139.0" y="160.0" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="middle">Redis</text>
  <!-- 统一入口：开放式 OpenAPI -->
  <rect x="32" y="203" width="1186" height="63" fill="#003FF9"/>
  <text x="625" y="244" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">开放式 OpenAPI</text>
  <!-- 第二层：四大管理域（集群 / 应用 / 策略 / 运维） -->
  <rect x="32" y="279" width="286" height="290" fill="#D1EBFE"/>
  <text x="50" y="319" font-size="21" font-weight="700" fill="#191A1B">集群管理</text>
  <rect x="50" y="330" width="250" height="62" fill="#003FF9"/>
  <text x="175" y="368.0" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">集群统一纳管</text>
  <rect x="50" y="410" width="250" height="62" fill="#003FF9"/>
  <text x="175" y="436" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">集群全生命周期管理</text>
  <text x="175" y="456" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">（DKE/DKG）</text>
  <rect x="50" y="490" width="250" height="62" fill="#003FF9"/>
  <text x="175" y="528.0" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">集群升级</text>
  <rect x="330" y="279" width="286" height="290" fill="#D1EBFE"/>
