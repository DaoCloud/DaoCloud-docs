  <rect x="944" y="410" width="250" height="62" fill="#003FF9"/>
  <text x="1069" y="448.0" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">监控</text>
  <rect x="944" y="490" width="250" height="62" fill="#003FF9"/>
  <text x="1069" y="528.0" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">事件</text>
  <!-- 多云/混合云容器管理 -->
  <rect x="32" y="582" width="1186" height="63" fill="#003FF9"/>
  <text x="625" y="623" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">多云/混合云容器管理</text>
