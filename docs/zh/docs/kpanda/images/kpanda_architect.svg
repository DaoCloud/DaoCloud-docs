  <rect x="348" y="410" width="250" height="62" fill="#003FF9"/>
  <text x="473" y="448.0" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">应用编排</text>
  <rect x="348" y="490" width="250" height="62" fill="#003FF9"/>
  <text x="473" y="528.0" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">应用弹性伸缩</text>
  <rect x="628" y="279" width="286" height="290" fill="#D1EBFE"/>
  <text x="646" y="319" font-size="21" font-weight="700" fill="#191A1B">策略管理</text>
  <rect x="646" y="330" width="119" height="62" fill="#003FF9"/>
  <text x="705.5" y="368.0" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="middle">网络策略</text>
  <rect x="777" y="330" width="119" height="62" fill="#003FF9"/>
  <text x="836.5" y="368.0" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="middle">配额策略</text>
  <rect x="646" y="410" width="119" height="62" fill="#003FF9"/>
  <text x="705.5" y="448.0" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="middle">资源限制</text>
  <rect x="777" y="410" width="119" height="62" fill="#003FF9"/>
  <text x="836.5" y="448.0" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="middle">安全限制</text>
  <rect x="646" y="490" width="250" height="62" fill="#003FF9"/>
  <text x="771" y="528.0" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="middle">灾备策略</text>
  <rect x="926" y="279" width="286" height="290" fill="#D1EBFE"/>
  <text x="944" y="319" font-size="21" font-weight="700" fill="#191A1B">运维管理</text>
  <rect x="944" y="330" width="250" height="62" fill="#003FF9"/>
