<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" width="100%" role="img" aria-labelledby="ktitle kdesc" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif">
  <title id="ktitle">DCE 容器管理逻辑架构</title>
  <desc id="kdesc">容器管理逻辑架构自上而下：承载应用层（微服务、企业应用现代化、大数据、数据库应用）；开放式 OpenAPI；四大管理域（集群管理、应用管理、策略管理、运维管理）；多云/混合云容器管理；容器云平台（DaoCloud、Kubernetes、OpenShift、蓝牛等）；数据中心（公有云、私有云、专有云）；底层基础设施（计算 + 存储 + 网络）。</desc>
