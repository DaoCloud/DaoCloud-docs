<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2120 620" width="100%" role="img" aria-label="在非主流操作系统上创建集群的流程：先在在线环境构建离线包，再把离线包拷贝到离线节点并在离线环境安装，最后创建 DCE 5.0 工作集群" font-family="'PingFang SC','Noto Sans SC','Source Han Sans SC','Microsoft YaHei','Hiragino Sans GB',system-ui,sans-serif">
  <title>在非主流操作系统上创建集群的流程</title>
  <rect width="2120" height="620" fill="#FFFFFF"/>

  <!-- 总标题 -->
  <text x="50" y="74" font-size="41" font-weight="600" fill="#333333">环境准备</text>

  <!-- 虚线框：把第 1、2 步圈在同一环境准备阶段内 -->
  <rect x="46" y="123" width="1383" height="460" rx="70" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="7 8"/>

  <!-- 三个步骤标签 -->
  <g font-size="41" font-weight="500" fill="#333333">
    <text x="103" y="228">1、在线环境构建离线包</text>
    <text x="866" y="228">2、离线环境安装离线包</text>
    <text x="1662" y="228">3、创建工作集群</text>
  </g>

  <!-- 三个节点：在线节点 → 离线节点 → DCE 5.0 -->
  <g stroke="#000000" stroke-width="2">
    <rect x="78" y="379" width="510" height="126" rx="15" fill="#EBFDD1"/>
    <rect x="856" y="379" width="458" height="126" rx="15" fill="#D6FDA4"/>
    <rect x="1608" y="379" width="459" height="126" rx="15" fill="#C3FC7C"/>
  </g>

  <g font-size="66" fill="#000000" text-anchor="middle">
    <text x="333" y="467">在线节点</text>
    <text x="1085" y="467">离线节点</text>
    <text x="1837" y="466">DCE 5.0</text>
  </g>

  <!-- 第 1 步 → 第 2 步：拷贝离线包（虚线箭头） -->
  <text x="715" y="425" font-size="31" fill="#333333" text-anchor="middle">拷贝离线包</text>
  <line x1="590" y1="443" x2="835" y2="443" stroke="#000000" stroke-width="2" stroke-dasharray="7 8"/>
  <polygon points="832,433 855,443 832,453" fill="#000000"/>

  <!-- 第 3 步：从环境准备阶段出来，创建工作集群（实线箭头） -->
  <line x1="1427" y1="443" x2="1588" y2="443" stroke="#000000" stroke-width="2"/>
  <polygon points="1585,433 1608,443 1585,453" fill="#000000"/>
</svg>
