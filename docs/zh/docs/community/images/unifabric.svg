  rect[fill="#f2f7fe" i]{fill:#232a36}
  rect[fill="#f7faff" i]{fill:#232a36}
  rect[fill="#fdf1de" i]{fill:#232a36}
  rect[fill="#fffdf8" i]{fill:#232a36}
  rect[fill="#ffffff" i]{fill:#232a36}
