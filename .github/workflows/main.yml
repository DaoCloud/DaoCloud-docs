name: deploy-for-main

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'Makefile'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

env:
  UCLOUD_PUBLICKEY : ${{ secrets.UCLOUD_PUBLICKEY }}
  UCLOUD_PRIVATEKEY : ${{ secrets.UCLOUD_PRIVATEKEY }}
  UCLOUD_REGION : ${{ secrets.UCLOUD_REGION }}
  UCLOUD_BUCKET : ${{ secrets.UCLOUD_BUCKET }}
  CI: 1

concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 保持默认（1）：站点未启用 git-revision-date 类插件，
      # 全历史克隆（.git 约 1.8G）只会让 checkout 白白多花 ~30s。
      - uses: actions/checkout@v4

      - name: Checkout OpenAPI docs
        uses: actions/checkout@v4
        with:
          repository: daocloud/daocloud-api-docs
          path: dao-openapi

      - name: Checkout download docs
        uses: actions/checkout@v4
        with:
          repository: daocloud/daocloud-download-docs
          path: daocloud-download-docs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v8.1.0

      - run: make sync

      - run: make merge-external-docs

      # make build all 由 scripts/build_all.sh 并行构建 zh + en（详见该脚本注释）
      - run: make build all

      # ↓ 增量上传：只把内容有变化的产物推给七牛，避免每次全量 POST 上万个文件
      - name: Restore upload manifest
        uses: actions/cache@v4
        with:
          path: |
            .qiniu-manifest.json
            .qiniu-cache-state.json
          key: qiniu-manifest-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            qiniu-manifest-${{ github.ref_name }}-

      - name: Compute changed files
        id: changed
        run: python3 scripts/ci/qiniu_changed.py public .qiniu-manifest.json qiniu-upload

      - name: Upload to Qiniu Kodo
        if: steps.changed.outputs.changed != '0'
        uses: samzong/action-qiniu-upload-nodejs@v0.0.8
        with:
          access_key: ${{ secrets.QINIU_ACCESS_KEY }}
          secret_key: ${{ secrets.QINIU_SECRET_KEY }}
          bucket: ${{ secrets.QINIU_BUCKET }}
          source_dir: qiniu-upload
          dest_dir: /
          # 这里只放「内容有变化」的文件，所以用 always：确保改动过的图片等媒体文件也会被覆盖。
          # （若把整个 public/ 交给它，smart 策略会跳过媒体文件，导致更新过的图片推不上去）
          overwrite: always
          concurrency: 100

      # ↓ 缓存策略分两层，不要混为一谈：
      #
      #   ① 空间默认值：七牛对「未设 Cache-Control 元数据」的对象默认下发
      #      max-age=31536000（1 年）。管理员已在 Kodo 控制台把 docs-daocloud-io
      #      的空间设置「文件客户端缓存 maxAge」改为 300 秒，因此之后新上传的文件
      #      （含图片、PDF 等本脚本不覆盖的类型）最迟 5 分钟即可更新。
      #      注意：该属性只作用于新上传的文件，存量对象不受影响。
      #
      #   ② 本步骤：把 HTML / 搜索索引 / sitemap 精确设成 no-cache，比 300 秒更严格，
      #      发版后立即生效（内容没变时只是 304 校验，开销很小）。同时承担一次性
      #      修存量的职责 —— 空间属性改不了已有对象，全站 6198 个 HTML 目前仍是 1 年，
      #      首次运行状态文件为空，会全量走 /batch 改一遍（约 7 次请求）。
      #
      #   CDN 刷新阶段已停用：docs.daocloud.io 的 CNAME 指向 iovip-z0.qiniuio.com，
      #   属于 Kodo 源站直连、未接入 CDN，刷新接口恒返回 400032。
      #   因此这里不传 --refresh；将来真接了 CDN，再加回
      #   `--refresh https://docs.daocloud.io/ --max-refresh <每日上限>` 即可。
      - name: Selftest cache-control script
        run: python3 scripts/ci/qiniu_set_cache.py --selftest

      - name: Fix Cache-Control for HTML and search index
        run: python3 scripts/ci/qiniu_set_cache.py public --state .qiniu-cache-state.json
        env:
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
