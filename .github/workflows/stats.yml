name: update visit stats

# 每 6 小时从计数 Worker 拉累计数据，写入站点兜底文件并推回 main。
# 前置 secrets：
#   COUNTER_TOKEN —— Worker 的 STATS_TOKEN，访问 /stats 接口
#   STATS_PAT     —— 管理员账号的 fine-grained PAT（仅本仓、Contents 读写）。
#     main 有分支保护，github-actions[bot] 无法加入绕过名单（内置身份不可选），
#     用管理员 PAT 推送可凭管理员身份绕过 PR 要求。

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-visit-stats
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # checkout 用 PAT，凭据会持续到 push 步骤，绕过分支保护
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.STATS_PAT }}

      - name: Fetch stats from counter worker
        env:
          ENDPOINT: https://docs-counter.daocloud.workers.dev
          TOKEN: ${{ secrets.COUNTER_TOKEN }}
        run: |
          curl -sf --max-time 30 "$ENDPOINT/stats" -H "X-Stats-Token: $TOKEN" -o /tmp/stats.json
          python3 -c "import json; d=json.load(open('/tmp/stats.json')); assert isinstance(d['pv'], int) and isinstance(d['uv'], int)"
          python3 - <<'EOF'
          import json
          d = json.load(open('/tmp/stats.json'))
          keep = {k: d[k] for k in ('pv', 'uv', 'updated')}
          keep['daily'] = d.get('daily', {})
          out = json.dumps(keep, ensure_ascii=False, indent=2) + '\n'
          for p in ('docs/zh/docs/stats.json',):
              open(p, 'w', encoding='utf-8').write(out)
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/zh/docs/stats.json
          if git diff --cached --quiet; then
            echo "No change, skip commit"
          else
            # 不带 [skip ci]：让 deploy-for-main 触发站点构建，把 stats.json 部署到线上
            # （stats.yml 本身只由 cron/workflow_dispatch 触发，不存在递归）
            git commit -m "chore: update visit stats"
            git push
          fi
